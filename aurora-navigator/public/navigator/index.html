<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Navigator — Premium Route Planner</title>
  <meta name="description" content="A stunning interactive navigation app with glassmorphism UI, powered by MapTiler." />

  <!-- MapLibre GL JS (compatible with MapTiler) -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background blobs -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!-- Map container (fullscreen) -->
  <div id="map" aria-label="Interactive map"></div>

  <!-- Top bar -->
  <header class="topbar glass">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L19 21 L12 17 L5 21 Z"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Aurora</span>
        <span class="brand-sub">Navigator</span>
      </div>
    </div>

    <div class="topbar-actions">
      <button id="themeToggle" class="icon-btn" title="Toggle theme (T)" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Floating control panel -->
  <aside id="panel" class="panel glass" aria-label="Route controls">
    <button id="collapseBtn" class="collapse-btn" title="Collapse panel" aria-label="Collapse panel">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </button>

    <div class="panel-header">
      <h1 class="panel-title">Plan your route</h1>
      <p class="panel-subtitle">Enter coordinates and let Aurora draw the way.</p>
    </div>

    <form id="routeForm" class="form" novalidate>
      <!-- Origin -->
      <div class="field-group">
        <div class="field-label">
          <span class="dot dot-start"></span>
          <label>From</label>
          <button type="button" id="useMyLocation" class="ghost-btn" title="Use my location">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            </svg>
            Use my location
          </button>
        </div>
        <div class="row">
          <div class="input-wrap">
            <input id="startLat" type="number" step="any" placeholder="Latitude" inputmode="decimal" />
            <button type="button" class="copy-btn" data-copy="startLat" title="Copy">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
          </div>
          <div class="input-wrap">
            <input id="startLng" type="number" step="any" placeholder="Longitude" inputmode="decimal" />
            <button type="button" class="copy-btn" data-copy="startLng" title="Copy">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Swap -->
      <div class="swap-row">
        <button type="button" id="swapBtn" class="swap-btn" title="Swap origin and destination" aria-label="Swap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/>
          </svg>
        </button>
      </div>

      <!-- Destination -->
      <div class="field-group">
        <div class="field-label">
          <span class="dot dot-end"></span>
          <label>To</label>
        </div>
        <div class="row">
          <div class="input-wrap">
            <input id="endLat" type="number" step="any" placeholder="Latitude" inputmode="decimal" />
            <button type="button" class="copy-btn" data-copy="endLat" title="Copy">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
          </div>
          <div class="input-wrap">
            <input id="endLng" type="number" step="any" placeholder="Longitude" inputmode="decimal" />
            <button type="button" class="copy-btn" data-copy="endLng" title="Copy">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Profile -->
      <div class="profile-row">
        <label class="profile-opt">
          <input type="radio" name="profile" value="driving" checked />
          <span>🚗 Drive</span>
        </label>
        <label class="profile-opt">
          <input type="radio" name="profile" value="cycling" />
          <span>🚴 Cycle</span>
        </label>
        <label class="profile-opt">
          <input type="radio" name="profile" value="walking" />
          <span>🚶 Walk</span>
        </label>
      </div>

      <!-- Submit -->
      <button id="submitBtn" type="submit" class="primary-btn">
        <span class="btn-label">Get directions</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <!-- Error -->
      <div id="errorBox" class="error-box" role="alert" hidden></div>

      <!-- Stats -->
      <div id="stats" class="stats" hidden>
        <div class="stat">
          <span class="stat-label">Distance</span>
          <span id="statDistance" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Duration</span>
          <span id="statDuration" class="stat-value">—</span>
        </div>
      </div>
    </form>

    <div class="panel-footer">
      <kbd>Enter</kbd> to search · <kbd>T</kbd> to toggle theme
    </div>
  </aside>

  <!-- Toast -->
  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
